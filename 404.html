<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <title>Hissan は引っ越しました</title>
    <link rel="icon" href="/calculation-pad-pages/favicon.ico" />
    <link rel="canonical" href="https://calculation-pad.attv.workers.dev/" />
    <meta http-equiv="refresh" content="0; url=https://calculation-pad.attv.workers.dev/" />
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --fg: #1a1a1a;
        --muted: #666666;
        --accent: #2563eb;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #121212;
          --fg: #f0f0f0;
          --muted: #a0a0a0;
          --accent: #7aa2f7;
        }
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--bg);
        color: var(--fg);
        font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
        line-height: 1.7;
        padding: 1.5rem;
        box-sizing: border-box;
      }
      main {
        max-width: 32rem;
        text-align: center;
      }
      h1 {
        font-size: 1.25rem;
        margin: 0 0 0.75rem;
      }
      p {
        margin: 0 0 1rem;
        color: var(--muted);
        font-size: 0.95rem;
      }
      a.go {
        display: inline-block;
        margin-top: 0.5rem;
        padding: 0.7rem 1.4rem;
        border-radius: 999px;
        background: var(--accent);
        color: #ffffff;
        text-decoration: none;
        font-weight: 600;
      }
      .en {
        margin-top: 1.75rem;
        font-size: 0.85rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Hissan（計算用紙）は新しいURLに移転しました</h1>
      <p>
        自動的に移動します。切り替わらない場合は下のボタンから移動してください。<br />
        ブックマークの更新もお願いします。
      </p>
      <a class="go" href="https://calculation-pad.attv.workers.dev/">新しいページを開く</a>
      <p class="en">
        This app has moved to
        <a href="https://calculation-pad.attv.workers.dev/">calculation-pad.attv.workers.dev</a>.
      </p>
    </main>
    <script>
      location.replace('https://calculation-pad.attv.workers.dev/');
    </script>
  </body>
</html>
